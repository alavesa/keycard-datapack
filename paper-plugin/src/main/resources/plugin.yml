name: Keycards
version: '${project.version}'
main: fi.alavesa.keycards.KeycardsPlugin
softdepend: [Labra]
api-version: '1.21'
description: Companion plugin for the Keycards datapack (readers, doors, card menu, swipe animation).
commands:
  keycards:
    description: Open the keycard menu, or manage keypad doors
    usage: /keycards [keypad place <code>|keypad set <code>|keypad remove]
    aliases: [kc]
permissions:
  keycards.admin:
    description: Open the keycard menu and grant cards of any clearance level
    default: op
  keycards.keypad:
    description: Bind and remove secret keypad codes on doors
    default: op
